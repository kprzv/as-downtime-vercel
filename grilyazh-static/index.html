<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4efe8"><title>Грильяж Кейтеринг — прототип</title><style>:root{--bg:#f4efe8;--paper:#fffaf4;--ink:#231f1b;--muted:#756c64;--line:#ddd1c3;--accent:#9a6a46;--dark:#2b2520}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1120px;margin:auto;padding:24px}.top{position:sticky;top:0;z-index:10;background:rgba(244,239,232,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.topin{max-width:1120px;margin:auto;padding:12px 20px;display:flex;gap:12px;align-items:center}.brand{font:600 22px Georgia}.grow{flex:1}.btn{border:1px solid var(--dark);background:var(--dark);color:#fff;border-radius:999px;padding:11px 16px}.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}.hero{padding:56px 0}.hero h1,.title{font-family:Georgia,serif;font-weight:500}.hero h1{font-size:clamp(48px,9vw,88px);line-height:.92;margin:8px 0 18px}.muted{color:var(--muted)}.stats,.dirs,.grid2{display:grid;gap:12px}.stats{grid-template-columns:repeat(3,1fr);margin:34px 0}.stat{border-top:1px solid var(--line);padding-top:16px}.stat b{font:500 30px Georgia}.dirs{grid-template-columns:repeat(5,1fr)}.card{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:20px;text-align:left}.card h3{font:500 26px Georgia;margin:0 0 8px}.card p{margin:0;color:var(--muted)}.card:hover{transform:translateY(-2px)}.page{padding:32px 0 70px}.title{font-size:44px;line-height:1;margin:0 0 10px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.choice{min-height:92px}.choice b{font:500 22px Georgia}.progress{height:4px;background:#e9ded2;border-radius:5px;margin:18px 0 26px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}.headrow{display:flex;gap:10px;align-items:center;justify-content:space-between}.stepname{font-size:12px;color:var(--muted)}.panel{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:20px}.panel+.panel{margin-top:12px}.panel h2{font:500 30px Georgia;margin:0 0 8px}.multi{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px;text-align:left}.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:13px;color:var(--muted)}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px}.navrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.days{display:grid;gap:12px}.sum{border:1px solid var(--line);border-radius:15px;padding:14px;background:#fff}.sumtop{display:flex;justify-content:space-between;gap:8px}.sumtop b{font-family:Georgia}.small{font-size:12px}.hide{display:none!important}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#25211d;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;z-index:30}.foot{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:13px}@media(max-width:760px){.dirs{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr}.choices,.multi,.grid2{grid-template-columns:1fr}.topin{padding:10px 14px}.wrap{padding:18px 14px}.hero{padding:36px 0}.title{font-size:36px}.card{padding:16px}.card h3{font-size:22px}}@media(max-width:430px){.dirs{grid-template-columns:1fr}.hero h1{font-size:52px}.btn{min-height:44px}.opt{min-height:48px}}</style></head><body><div id="app"></div><script>const BIZ=['Корпоративное мероприятие','Конференция / форум','Клиентское / партнёрское мероприятие','Деловая встреча / приём','Другое'];const EVT=['Публичное / городское мероприятие','Культурное / развлекательное событие','Спортивное мероприятие','Официальное / VIP-мероприятие','Другое'];const WHO=['Посетители мероприятия / общий поток','VIP / приглашённые гости','Участники / артисты / спортсмены','Команда / персонал','Другое'];const NEED=['Точки питания / выдачи','Кофе-станция','Фуршет','Банкет','Комплексное питание / обеды','Другое'];const EXTRA=['Мебель','Шатры','Посуда и стекло','Текстиль','Бар / кофе-станция','Оборудование','Официанты','Бармены','Другой персонал','Другое'];const MEALS=['Кофе-брейк','Фуршет','Банкет','Комплексное питание / обед','Другое'];const K='grilyazh-live-v4';function fresh(){return{page:'home',dir:null,type:null,bStep:0,eStep:0,dates:[],who:[],need:[],days:{},extra:[],venue:'',comment:'',files:0,contacts:{name:'',phone:'',tg:'',email:'',company:''},program:[],menu:'',services:'',wishes:'',sent:false}}let s;try{s=Object.assign(fresh(),JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){s=fresh()}function save(){try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}}function esc(x=''){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function setPage(p){s.page=p;save();render();scrollTo(0,0)}function pick(arr,v){let i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v);save();render()}function top(){return`<div class=top><div class=topin><div class=brand>Грильяж Кейтеринг</div><div class=grow></div><button class="btn alt small" onclick="setPage('home')">Главная</button></div></div>`}function foot(){return`<div class=wrap><div class=foot>Демонстрационный прототип. BUSINESS — подробный конфигуратор, EVENTS — короткая квалифицирующая заявка.</div></div>`}function home(){return top()+`<main class=wrap><section class=hero><div class=muted>Калининград · кейтеринг полного цикла</div><h1>КЕЙТЕРИНГ<br>ПОЛНОГО ЦИКЛА</h1><p class=muted>Наглядный прототип нового пути клиента: выбрать направление, пройти сценарий и передать менеджеру структурированную заявку.</p><div class=stats><div class=stat><b>25+ лет</b><span class=muted>опыта</span></div><div class=stat><b>700+</b><span class=muted>мероприятий в год</span></div><div class=stat><b>до 1500+</b><span class=muted>гостей</span></div></div><div class=dirs>${[['BUSINESS','Для компаний и деловых мероприятий'],['EVENTS','Для публичных и событийных проектов'],['PRIVATE','Частные мероприятия'],['BOX','Готовые наборы / доставка'],['RENT','Аренда']].map(([a,b])=>`<button class=card onclick="dir('${a}')"><h3>${a}</h3><p>${b}</p></button>`).join('')}</div></section></main>`+foot()}function dir(d){s.dir=d;s.type=null;s.bStep=0;s.eStep=0;if(d==='BUSINESS'||d==='EVENTS')setPage('type');else setPage('stub')}function stub(){return top()+`<main class="wrap page"><h1 class=title>${s.dir}</h1><div class=panel><h2>Следующий этап проектирования</h2><p class=muted>Механика этого направления пока не согласована. Здесь будет отдельный путь клиента.</p><div class=navrow><button class=btn onclick="setPage('home')">К направлениям</button></div></div></main>`+foot()}function typePage(){let arr=s.dir==='BUSINESS'?BIZ:EVT;return top()+`<main class="wrap page"><div class=muted>${s.dir}</div><h1 class=title>Выберите тип мероприятия</h1><p class=muted>Одиночный выбор: нажатие сразу переводит на следующий этап.</p><div class=choices>${arr.map(x=>`<button class="card choice" onclick="chooseType('${esc(x)}')"><b>${x}</b></button>`).join('')}</div></main>`+foot()}function chooseType(t){s.type=t;if(s.dir==='BUSINESS'){s.page='business';s.bStep=0}else{s.page='events';s.eStep=0}save();render();scrollTo(0,0)}function pct(i,n){return Math.round(((i+1)/n)*100)}function backBiz(){if(s.bStep>0)s.bStep--;else s.page='type';save();render();scrollTo(0,0)}function nextBiz(){s.bStep=Math.min(s.bStep+1,7);save();render();scrollTo(0,0)}function business(){const names=['Даты','Программа питания','Меню','Аренда и доп. услуги','Обслуживание','Площадка','Пожелания','Сводка + контакты'];return top()+`<main class="wrap page"><div class=headrow><button class="btn alt" onclick=backBiz()>← Назад</button><div class=stepname>BUSINESS · ${s.type} · ${names[s.bStep]}</div></div><div class=progress><i style="width:${pct(s.bStep,8)}%"></i></div>${bizStep()}</main>`+foot()}function bizStep(){if(s.bStep===0)return datesBlock('biz');if(s.bStep===1)return`<div class=panel><h2>Программа питания</h2><p class=muted>Добавьте один или несколько приёмов пищи. Формат может повторяться.</p><div id=prog>${(s.program||[]).map((p,i)=>`<div class=grid2><div class=field><label>Формат питания</label><input value="${esc(p.format)}" onchange="s.program[${i}].format=this.value;save()"></div><div class=field><label>Время начала</label><input type=time value="${p.time||''}" onchange="s.program[${i}].time=this.value;save()"></div><div class=field><label>Количество гостей</label><input inputmode=numeric value="${p.guests||''}" onchange="s.program[${i}].guests=this.value;save()"></div><div class=field><label>&nbsp;</label><button class="btn alt" onclick="s.program.splice(${i},1);save();render()">Удалить</button></div></div>`).join('')}</div><div class=navrow><button class="btn alt" onclick="s.program.push({format:'Кофе-брейк',time:'10:00',guests:''});save();render()">+ Добавить приём</button><button class=btn onclick=nextBiz()>Продолжить</button></div></div>`;if(s.bStep===2)return textStep('Меню','Меню редактируется для конкретного приёма пищи. В полном сайте здесь будут карточки блюд, цены и количество.','menu');if(s.bStep===3)return textStep('Аренда и доп. услуги','Мебель, посуда, текстиль, шатры, бар / кофе-станция, оборудование, декор, другое.','rent');if(s.bStep===4)return textStep('Обслуживание','Официанты, бармены, другой персонал. Рекомендации по официантам — отдельная логика BUSINESS.','services');if(s.bStep===5)return textStep('Площадка','Название или адрес площадки. Для BUSINESS допускается помощь с подбором.','venueBiz');if(s.bStep===6)return textStep('Пожелания','Диеты, аллергии, алкоголь, особенности, комментарий и файлы.','wishes');return bizSummary()}function textStep(title,desc,key){let val=key==='menu'?s.menu:key==='services'?s.services:key==='wishes'?s.wishes:key==='venueBiz'?s.venue:(s[key]||'');return`<div class=panel><h2>${title}</h2><p class=muted>${desc}</p><div class=field><label>Комментарий / выбор для прототипа</label><textarea rows=6 onchange="s['${key==='venueBiz'?'venue':key}']=this.value;save()">${esc(val)}</textarea></div><div class=navrow><button class=btn onclick=nextBiz()>Продолжить</button></div></div>`}function bizSummary(){return`<div class=panel><h2>Сводка + контакты</h2><div class=days>${sum('Тип',s.type)}${sum('Даты',s.dates.join(', ')||'не заполнено — менеджер уточнит')}${sum('Программа',(s.program||[]).map(x=>`${x.format} ${x.time} · ${x.guests||'—'} гостей`).join('; ')||'не заполнено — менеджер уточнит')}${sum('Меню',s.menu||'не заполнено — менеджер уточнит')}${sum('Площадка',s.venue||'не заполнено — менеджер уточнит')}${sum('Пожелания',s.wishes||'не заполнено — менеджер уточнит')}</div>${contacts('BUSINESS')}<div class=navrow><button class=btn onclick="send('BUSINESS')">Отправить мероприятие на расчёт</button></div></div>`}function backEv(){if(s.eStep>0)s.eStep--;else s.page='type';save();render();scrollTo(0,0)}function nextEv(){s.eStep=Math.min(s.eStep+1,7);save();render();scrollTo(0,0)}function events(){const names=['Даты','Кого обслуживать','Что требуется','Данные по дням','Дополнительные услуги','Площадка','Дополнительная информация','Сводка + контакты'];return top()+`<main class="wrap page"><div class=headrow><button class="btn alt" onclick=backEv()>← Назад</button><div class=stepname>EVENTS · ${s.type} · ${names[s.eStep]}</div></div><div class=progress><i style="width:${pct(s.eStep,8)}%"></i></div>${evStep()}</main>`+foot()}function evStep(){if(s.eStep===0)return datesBlock('events');if(s.eStep===1)return multiStep('Кого нужно обслуживать?','Можно выбрать несколько вариантов.',WHO,s.who,'who');if(s.eStep===2)return multiStep('Что требуется?','Можно выбрать несколько вариантов.',NEED,s.need,'need');if(s.eStep===3)return dayData();if(s.eStep===4)return multiStep('Дополнительные услуги','Количество и цены здесь не спрашиваем.',EXTRA,s.extra,'extra');if(s.eStep===5)return`<div class=panel><h2>Площадка</h2><p class=muted>Если площадка ещё не определена — оставьте поле пустым.</p><div class=field><label>Название или адрес</label><input value="${esc(s.venue)}" onchange="s.venue=this.value;save()"></div><div class=navrow><button class=btn onclick=nextEv()>Продолжить</button></div></div>`;if(s.eStep===6)return`<div class=panel><h2>Дополнительная информация</h2><p class=muted>Шаг можно пропустить.</p><div class=field><label>Комментарий к мероприятию</label><textarea rows=6 placeholder="Особенности мероприятия, пожелания, ограничения или организационные нюансы" onchange="s.comment=this.value;save()">${esc(s.comment)}</textarea></div><button class="btn alt" onclick="s.files++;save();render()">Прикрепить файл / ТЗ / схему / фото</button>${s.files?`<p class=small>Прикреплено файлов: ${s.files}</p>`:''}<div class=navrow><button class=btn onclick=nextEv()>Перейти к сводке</button></div></div>`;return evSummary()}function datesBlock(mode){return`<div class=panel><h2>Даты</h2><p class=muted>Выберите одну или несколько дат. Для прототипа используем системный календарь.</p><div class=grid2><div class=field><label>Добавить дату</label><input id=datepick type=date></div><div class=field><label>&nbsp;</label><button class="btn alt" onclick="let v=document.getElementById('datepick').value;if(v&&!s.dates.includes(v))s.dates.push(v);save();render()">Добавить</button></div></div><div class=navrow>${s.dates.map((d,i)=>`<button class="btn alt" onclick="s.dates.splice(${i},1);delete s.days['${d}'];save();render()">${d} ×</button>`).join('')}</div><div class=navrow><button class="btn ${s.dates.length?'':'alt'}" ${s.dates.length?'':'disabled'} onclick="${mode==='biz'?'nextBiz()':'nextEv()'}">Продолжить</button></div></div>`}function multiStep(title,desc,arr,selected,key){return`<div class=panel><h2>${title}</h2><p class=muted>${desc}</p><div class=multi>${arr.map(x=>`<button class="opt ${selected.includes(x)?'on':''}" onclick="pick(s.${key},'${esc(x)}')">${selected.includes(x)?'✓ ':''}${x}</button>`).join('')}</div><div class=navrow><button class=btn onclick=nextEv()>Продолжить</button></div></div>`}function dayData(){return`<div class=panel><h2>Данные по дням</h2><p class=muted>Время и количество гостей задаются отдельно для каждой выбранной даты.</p><div class=days>${s.dates.map((d,i)=>{let v=s.days[d]||(s.days[d]={guests:'',attendance:'',start:'',end:''});return`<div class=sum><div class=sumtop><b>${d}</b>${i===0&&s.dates.length>1?`<button class="btn alt small" onclick="copyDays('${d}')">Применить ко всем дням</button>`:''}</div><div class=grid2><div class=field><label>Сколько человек планируется обслуживать?</label><input inputmode=numeric value="${esc(v.guests)}" onchange="s.days['${d}'].guests=this.value;save()"></div><div class=field><label>Общая посещаемость (необязательно)</label><input inputmode=numeric value="${esc(v.attendance)}" onchange="s.days['${d}'].attendance=this.value;save()"></div><div class=field><label>Начало работы</label><input type=time value="${v.start}" onchange="s.days['${d}'].start=this.value;save()"></div><div class=field><label>Окончание работы</label><input type=time value="${v.end}" onchange="s.days['${d}'].end=this.value;save()"></div></div></div>`}).join('')}</div><div class=navrow><button class=btn onclick=nextEv()>Продолжить</button></div></div>`}function copyDays(src){let v=s.days[src]||{};s.dates.forEach(d=>s.days[d]=Object.assign({},v));save();render();toast('Данные применены ко всем дням')}function contacts(dir){let c=s.contacts;return`<h3 style="font-family:Georgia;margin-top:24px">Контакты</h3><div class=grid2><div class=field><label>Имя</label><input value="${esc(c.name)}" onchange="s.contacts.name=this.value;save()"></div><div class=field><label>Телефон</label><input value="${esc(c.phone)}" onchange="s.contacts.phone=this.value;save()"></div><div class=field><label>Telegram / мессенджер</label><input value="${esc(c.tg)}" onchange="s.contacts.tg=this.value;save()"></div><div class=field><label>Email</label><input value="${esc(c.email)}" onchange="s.contacts.email=this.value;save()"></div><div class=field><label>${dir==='EVENTS'?'Компания / организация':'Компания'}</label><input value="${esc(c.company)}" onchange="s.contacts.company=this.value;save()"></div></div>`}function evSummary(){return`<div class=panel><h2>Сводка + контакты</h2><p class=muted>Менеджер получит короткую структурированную заявку и сможет сразу перейти к предметному разговору.</p><div class=days>${sum('Тип мероприятия',s.type)}${sum('Даты',s.dates.join(', ')||'не указано')}${sum('Кого обслуживать',s.who.join(', ')||'не указано')}${sum('Что требуется',s.need.join(', ')||'не указано')}${sum('Данные по дням',s.dates.map(d=>{let v=s.days[d]||{};return`${d}: обслужить ${v.guests||'—'}${v.attendance?' · посещаемость '+v.attendance:''}${v.start||v.end?' · '+(v.start||'—')+'–'+(v.end||'—'):''}`}).join('<br>')||'не указано')}${sum('Дополнительные услуги',s.extra.join(', ')||'не указано')}${sum('Площадка',s.venue||'не указано')}${sum('Дополнительная информация',[s.comment,s.files?`файлов: ${s.files}`:''].filter(Boolean).join(' · ')||'не указано')}</div>${contacts('EVENTS')}<p class=small muted>Для отправки нужны имя и хотя бы один способ связи: телефон или Telegram / мессенджер.</p><div class=navrow><button class=btn onclick="send('EVENTS')">Отправить заявку менеджеру</button></div></div>`}function sum(t,v){return`<div class=sum><div class=sumtop><b>${t}</b></div><div class="muted small" style="margin-top:6px">${v}</div></div>`}function send(dir){let c=s.contacts;if(!c.name.trim()||!(c.phone.trim()||c.tg.trim())){toast('Укажите имя и телефон или мессенджер');return}s.sent=true;s.page='success';save();render();scrollTo(0,0)}function success(){let payload=s.dir==='EVENTS'?{direction:'EVENTS',event_type:s.type,dates:s.dates,who:s.who,required:s.need,days:s.days,additional_services:s.extra,venue:s.venue||null,comment:s.comment||null,files:s.files,contacts:s.contacts}:{direction:'BUSINESS',event_type:s.type,dates:s.dates,program:s.program,menu:s.menu||'не заполнено',services:s.services||'не заполнено',venue:s.venue||'не заполнено',wishes:s.wishes||'не заполнено',contacts:s.contacts};return top()+`<main class="wrap page"><div class=panel><div class=muted>Заявка получена</div><h1 class=title>${s.dir==='EVENTS'?'Заявка отправлена менеджеру':'Мероприятие отправлено на расчёт'}</h1><p class=muted>${s.dir==='EVENTS'?'Менеджер изучит информацию и свяжется с вами, чтобы уточнить детали и подготовить решение.':'Менеджер проверит состав и подтвердит финальную стоимость.'}</p><h2 style="font-family:Georgia;margin-top:28px">Что получил менеджер в Bitrix</h2><pre style="white-space:pre-wrap;overflow:auto;background:#f1e9e1;border-radius:14px;padding:14px;font-size:12px">${esc(JSON.stringify(payload,null,2))}</pre><div class=navrow><button class=btn onclick="s=fresh();save();render()">Начать заново</button></div></div></main>`+foot()}function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}function render(){let html=s.page==='home'?home():s.page==='type'?typePage():s.page==='stub'?stub():s.page==='business'?business():s.page==='events'?events():s.page==='success'?success():home();document.getElementById('app').innerHTML=html}render();</script></body></html>
