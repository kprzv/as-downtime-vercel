<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Грильяж Кейтеринг — интерактивный прототип</title><style>:root{--bg:#f4efe8;--paper:#fffaf4;--ink:#211d19;--mut:#746d65;--line:#ded3c7;--acc:#9b704e;--dark:#24201c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.serif,h1,h2,h3{font-family:Georgia,"Times New Roman",serif}.wrap{max-width:1180px;margin:auto;padding:24px}.top{position:sticky;top:0;z-index:20;background:rgba(244,239,232,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.topin{max-width:1180px;margin:auto;padding:14px 24px;display:flex;align-items:center;gap:18px}.brand{font-family:Georgia,serif;font-weight:700;font-size:22px}.topnav{margin-left:auto;display:flex;gap:14px;align-items:center}.topnav button{border:0;background:none;color:var(--mut)}.btn{border:1px solid var(--ink);background:var(--ink);color:white;border-radius:999px;padding:11px 16px;font-weight:700}.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}.hero{display:grid;grid-template-columns:1fr .9fr;gap:28px;padding:50px 0}.hero h1{font-size:clamp(48px,7vw,92px);line-height:.94;margin:0 0 18px;font-weight:500}.hero p{color:var(--mut);font-size:18px;line-height:1.55}.art{min-height:470px;position:relative}.ph{position:absolute;border-radius:28px;background:#d8c8b7;border:1px solid var(--line);overflow:hidden}.ph:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#b9a28b,#eadfd2)}.ph.a{inset:0 16% 24% 0}.ph.b{width:46%;height:38%;right:0;top:7%}.ph.c{width:44%;height:36%;right:2%;bottom:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:58px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px}.stat b{font:500 34px Georgia}.stat span{display:block;color:var(--mut);margin-top:5px}.title{font-size:42px;font-weight:500;margin:0 0 20px}.dirs{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px;text-align:left;min-height:210px}.card h3{font-size:26px;margin:0 0 8px;font-weight:500}.card p{color:var(--mut);line-height:1.45}.ready{margin:60px 0}.readygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.r{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px}.r h3{margin:0 0 8px;font-size:24px}.foot{border-top:1px solid var(--line);padding:24px;color:var(--mut);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.pagehead{padding:34px 0 18px}.pagehead h1{font-size:54px;margin:0 0 10px;font-weight:500}.back{border:0;background:none;color:var(--mut);padding:0}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:900px}.choice{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px;text-align:left;min-height:120px}.choice strong{font:500 25px Georgia}.scenarios{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;max-width:950px}.scenario{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:28px}.scenario.main{background:var(--dark);color:white}.scenario h3{font-size:31px;margin:0 0 10px}.scenario p{color:var(--mut)}.scenario.main p{color:#d5cec6}.shell{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start}.side{position:sticky;top:82px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:10px}.step{width:100%;border:0;background:none;text-align:left;padding:10px;border-radius:12px;color:var(--mut)}.step.on{background:#ece2d7;color:var(--ink);font-weight:700}.main{min-width:0}.headrow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.headrow h1{font-size:42px;margin:0 0 6px;font-weight:500}.saved{border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--mut);font-size:12px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px;margin:12px 0}.panel h2{font-size:28px;margin:0 0 16px;font-weight:500}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;color:var(--mut)}input,select,textarea{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:11px}.meal{border:1px solid var(--line);background:white;border-radius:16px;padding:14px;margin:10px 0}.mealrow{display:grid;grid-template-columns:1.2fr .8fr .8fr auto;gap:8px;align-items:end}.eventrow{display:grid;grid-template-columns:1.1fr 1fr .7fr .7fr auto;gap:8px;align-items:end}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tab{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 11px;white-space:nowrap}.tab.on{background:var(--ink);color:white}.dish{display:grid;grid-template-columns:1fr auto;gap:10px;border:1px solid var(--line);background:white;border-radius:14px;padding:14px;margin:8px 0}.dish small{color:var(--mut)}.qty{width:76px}.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:14px}.mut{color:var(--mut)}.total{font:500 42px Georgia;margin:4px 0}.sum{border-top:1px solid var(--line);padding:13px 0}.sumtop{display:flex;justify-content:space-between;gap:10px}.sumtop button{border:0;background:none;text-decoration:underline;color:var(--mut)}.modalbg{position:fixed;inset:0;background:rgba(20,18,16,.45);display:grid;place-items:center;padding:16px;z-index:50}.modal{max-width:620px;width:100%;background:var(--paper);border-radius:22px;padding:22px}.questions .q{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin:9px 0}.hide{display:none}.success pre{white-space:pre-wrap;background:#1f1c19;color:#eee5dd;border-radius:16px;padding:16px;overflow:auto}@media(max-width:850px){.topnav button:not(.btn){display:none}.hero{grid-template-columns:1fr}.art{min-height:340px}.dirs{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr}.readygrid,.choices,.scenarios{grid-template-columns:1fr}.shell{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto}.step{min-width:max-content}.grid2,.grid3{grid-template-columns:1fr}.mealrow,.eventrow{grid-template-columns:1fr 1fr}.hero h1{font-size:54px}.pagehead h1{font-size:42px}.wrap{padding:18px}.topin{padding:12px 18px}}@media(max-width:520px){.dirs{grid-template-columns:1fr}.mealrow,.eventrow{grid-template-columns:1fr}.headrow{flex-direction:column}.art{min-height:300px}}</style></head><body><div id="app"></div><script>const $=s=>document.querySelector(s);const A=document.getElementById('app');const menu=[['Тартар из говядины','720 ₽',720],['Брускетта с лососем','560 ₽',560],['Салат с ростбифом','620 ₽',620],['Мини-круассан с индейкой','340 ₽',340],['Треска с овощами','890 ₽',890],['Десерт Павлова','390 ₽',390]];const rent=[['Стул','450 ₽',450],['Стол банкетный','1200 ₽',1200],['Бокал','120 ₽',120],['Скатерть','650 ₽',650],['Шатёр','18000 ₽',18000],['Кофе-станция','9500 ₽',9500],['Тепловое оборудование','7000 ₽',7000]];const steps=['Даты','Программа питания','Меню','Аренда и доп. услуги','Обслуживание','Площадка','Пожелания','Сводка + контакты'];let state={page:'home',direction:'',type:'',step:0,dates:[],program:[],menu:{},rent:{},service:{},venue:'',wishes:'',contacts:{},submitted:false};try{Object.assign(state,JSON.parse(localStorage.grilyazh||'{}'))}catch(e){}function save(){localStorage.grilyazh=JSON.stringify(state)}function go(p){state.page=p;save();render();scrollTo(0,0)}function reset(){localStorage.removeItem('grilyazh');location.reload()}function top(){return `<div class="top"><div class="topin"><div class="brand">Грильяж</div><div class="topnav"><button onclick="go('home')">Направления</button><button onclick="document.getElementById('ready')?.scrollIntoView()">Готовые решения</button><button onclick="go('questions')">Для команды: вопросы</button><button class="btn" onclick="go('home');setTimeout(()=>document.getElementById('dirs')?.scrollIntoView(),50)">Собрать мероприятие</button></div></div></div>`}function foot(){return `<div class="foot"><span>Грильяж Кейтеринг · интерактивный прототип</span><button class="back" onclick="go('questions')">Вопросы на финальное согласование</button></div>`}function render(){if(state.submitted)return success();A.innerHTML=top()+(state.page==='home'?home():state.page==='direction'?direction():state.page==='scenario'?scenario():state.page==='config'?config():state.page==='questions'?questions():placeholder())+foot()}function home(){return `<main class="wrap"><section class="hero"><div><div style="text-transform:uppercase;letter-spacing:.13em;color:var(--acc);font-size:12px;font-weight:800">Грильяж Кейтеринг</div><h1>КЕЙТЕРИНГ ПОЛНОГО ЦИКЛА</h1><p>Новый сайт как инструмент первичного сбора заказа: клиент выбирает направление, собирает мероприятие и передаёт менеджеру уже структурированную заявку.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="document.getElementById('dirs').scrollIntoView()">Выбрать направление</button><button class="btn alt" onclick="manager()">Связаться с менеджером</button></div></div><div class="art"><div class="ph a"></div><div class="ph b"></div><div class="ph c"></div></div></section><section class="stats"><div class="stat"><b>25+</b><span>лет опыта</span></div><div class="stat"><b>700+</b><span>мероприятий в год</span></div><div class="stat"><b>до 1500+</b><span>гостей</span></div></section><section id="dirs"><h2 class="title">Направления</h2><div class="dirs">${[['BUSINESS','Для компаний и деловых мероприятий'],['EVENTS','Для публичных и событийных проектов'],['PRIVATE','Частные мероприятия'],['BOX','Готовые наборы и доставка'],['RENT','Аренда']].map(d=>`<button class="card" onclick="pickDir('${d[0]}')"><div><h3>${d[0]}</h3><p>${d[1]}</p></div><div style="font-size:26px">→</div></button>`).join('')}</div></section><section class="ready" id="ready"><h2 class="title">Готовые решения</h2><div class="readygrid">${[['Конференция на 100 гостей','BUSINESS','Конференция / форум'],['Корпоративный фуршет на 80 гостей','BUSINESS','Корпоративное мероприятие'],['Фестиваль с VIP-зоной','EVENTS','Публичное / городское мероприятие']].map(x=>`<div class="r"><h3>${x[0]}</h3><p class="mut">Можно взять решение за основу и дальше редактировать в том же конфигураторе.</p><button class="btn alt" onclick="prefill('${x[1]}','${x[2]}')">Взять за основу</button></div>`).join('')}</div></section></main>`}function pickDir(d){state.direction=d;if(['BUSINESS','EVENTS'].includes(d)){state.page='direction'}else state.page='placeholder';save();render()}function direction(){const list=state.direction==='BUSINESS'?['Корпоративное мероприятие','Конференция / форум','Клиентское / партнёрское мероприятие','Деловая встреча / приём','Другое']:['Публичное / городское мероприятие','Культурное / развлекательное событие','Спортивное мероприятие','Официальное / VIP-мероприятие','Другое'];return `<main class="wrap"><button class="back" onclick="go('home')">← Назад</button><div class="pagehead"><h1>${state.direction}</h1><p class="mut">Выберите тип мероприятия.</p></div><div class="choices">${list.map(x=>`<button class="choice" onclick="pickType('${x.replaceAll("'","\\'")}')"><strong>${x}</strong></button>`).join('')}</div></main>`}function pickType(t){state.type=t;state.page='scenario';save();render()}function scenario(){return `<main class="wrap"><button class="back" onclick="go('direction')">← Назад</button><div class="pagehead"><h1>${state.type}</h1><p>${state.direction}</p></div><div class="scenarios"><div class="scenario main"><h3>Собрать мероприятие самостоятельно</h3><p>Основной путь: даты, программа питания, меню, аренда, обслуживание и итоговая заявка.</p><button class="btn" style="background:white;color:#211d19;border-color:white" onclick="startConfig()">Начать сборку</button></div><div class="scenario"><h3>Связаться с менеджером</h3><p>Менеджеру передадим направление, тип события и всё, что вы успеете заполнить.</p><button class="btn alt" onclick="manager()">Связаться</button></div></div></main>`}function startConfig(){state.page='config';state.step=0;save();render()}function config(){return `<main class="wrap"><div class="shell"><aside class="side">${steps.map((s,i)=>`<button class="step ${i===state.step?'on':''}" onclick="jump(${i})">${i+1}. ${s}</button>`).join('')}</aside><section class="main"><div class="headrow"><div><div style="color:var(--acc);font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800">${state.direction} · ${state.type}</div><h1>${steps[state.step]}</h1></div><div class="saved">✓ данные сохраняются</div></div>${stepHtml()}</section></div></main>`}function jump(i){state.step=i;save();render();scrollTo(0,0)}function prev(){jump(Math.max(0,state.step-1))}function next(){jump(Math.min(7,state.step+1))}function nav(skip=true){return `<div class="navrow"><button class="btn alt" onclick="prev()">← Назад</button><div style="display:flex;gap:8px">${skip?`<button class="btn alt" onclick="next()">Пропустить</button>`:''}<button class="btn" onclick="next()">Далее →</button></div></div>`}function stepHtml(){return [datesStep,programStep,menuStep,rentStep,serviceStep,venueStep,wishesStep,summaryStep][state.step]()}function datesStep(){return `<div class="panel"><h2>Выберите дату или несколько дат</h2><div class="field"><label>Добавить дату</label><input id="newdate" type="date"></div><div style="margin-top:10px"><button class="btn alt" onclick="addDate()">+ Добавить дату</button></div><div style="margin-top:12px">${state.dates.map((d,i)=>`<button class="tab">${d} <span onclick="event.stopPropagation();state.dates.splice(${i},1);save();render()">×</span></button>`).join('')}</div>${state.dates.length>1?`<div class="panel" style="margin-top:14px"><b>Несколько дат</b><div class="grid2" style="margin-top:10px"><label class="choice"><input type="radio" name="days" checked> Применить один сценарий ко всем дням</label><label class="choice"><input type="radio" name="days"> Настроить каждый день отдельно</label></div></div>`:''}</div>${nav(false)}`}function addDate(){const v=$('#newdate').value;if(v&&!state.dates.includes(v))state.dates.push(v);save();render()}function addProgram(kind='group'){state.program.push({id:Date.now()+Math.random(),kind,name:kind==='flow'?'Публичная точка':'VIP-зона',format:kind==='flow'?'Потоковое обслуживание':'Фуршет',start:'12:00',end:kind==='flow'?'20:00':'',guests:kind==='flow'?600:120,pay:'Организатор оплачивает'});save();render()}function programStep(){return `<div class="panel"><h2>Программа питания</h2><p class="mut">${state.direction==='EVENTS'?'В EVENTS можно создавать как группы/зоны, так и потоковые точки. Блоки могут идти параллельно.':'Формат питания, время и количество гостей — в одной карточке.'}</p>${state.program.map((p,i)=>progCard(p,i)).join('')||'<p class="mut">Пока ничего не добавлено.</p>'}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn alt" onclick="addProgram('group')">+ ${state.direction==='EVENTS'?'Группа / зона':'Добавить приём пищи'}</button>${state.direction==='EVENTS'?`<button class="btn alt" onclick="addProgram('flow')">+ Поток посетителей</button>`:''}</div></div>${nav()}`}function progCard(p,i){if(state.direction==='EVENTS'&&p.kind==='flow')return `<div class="meal"><div class="eventrow"><div class="field"><label>Точка / зона</label><input value="${p.name}" onchange="state.program[${i}].name=this.value;save()"></div><div class="field"><label>Тип обслуживания</label><input value="${p.format}" onchange="state.program[${i}].format=this.value;save()"></div><div class="field"><label>С</label><input type="time" value="${p.start}" onchange="state.program[${i}].start=this.value;save()"></div><div class="field"><label>До</label><input type="time" value="${p.end}" onchange="state.program[${i}].end=this.value;save()"></div><button class="btn alt" onclick="state.program.splice(${i},1);save();render()">×</button></div><div class="grid2" style="margin-top:8px"><div class="field"><label>Ожидаемый поток</label><input type="number" value="${p.guests}" onchange="state.program[${i}].guests=+this.value;save()"></div><div class="field"><label>Формат работы</label><select onchange="state.program[${i}].pay=this.value;save()"><option>Организатор оплачивает</option><option>Продажа посетителям</option><option>Смешанный формат</option></select></div></div></div>`;return `<div class="meal"><div class="mealrow">${state.direction==='EVENTS'?`<div class="field"><label>Группа / зона</label><input value="${p.name}" onchange="state.program[${i}].name=this.value;save()"></div>`:`<div class="field"><label>Формат питания</label><select onchange="state.program[${i}].format=this.value;save()">${['Кофе-брейк','Фуршет','Банкет','Комплексное питание / обед','Другое'].map(x=>`<option ${p.format===x?'selected':''}>${x}</option>`).join('')}</select></div>`}${state.direction==='EVENTS'?`<div class="field"><label>Формат питания</label><select onchange="state.program[${i}].format=this.value;save()">${['Кофе-брейк','Фуршет','Банкет','Комплексное питание / обед','Другое'].map(x=>`<option ${p.format===x?'selected':''}>${x}</option>`).join('')}</select></div>`:''}<div class="field"><label>Время начала</label><input type="time" value="${p.start}" onchange="state.program[${i}].start=this.value;save()"></div><div class="field"><label>${state.direction==='EVENTS'?'Количество человек':'Количество гостей'}</label><input type="number" value="${p.guests}" onchange="state.program[${i}].guests=+this.value;save()"></div><button class="btn alt" onclick="state.program.splice(${i},1);save();render()">×</button></div>${state.direction==='EVENTS'?`<div class="field" style="margin-top:8px"><label>Время окончания — необязательно</label><input type="time" value="${p.end||''}" onchange="state.program[${i}].end=this.value;save()"></div>`:''}</div>`}function menuStep(){if(!state.program.length)return `<div class="panel"><h2>Меню</h2><p class="mut">Сначала добавьте хотя бы один блок в «Программе питания» или пропустите меню.</p></div>${nav()}`;const p=state.program[0];return `<div class="panel"><h2>Меню для: ${p.name||p.format} · ${p.start}</h2><p class="mut">Сначала популярные позиции. Формат питания — рекомендация, а не ограничение.</p>${menu.map((m,i)=>{const q=state.menu[i]||0;return `<div class="dish"><div><b>${m[0]}</b><br><small>${m[1]} · тестовая цена</small></div><input class="qty" type="number" min="0" value="${q}" onchange="state.menu[${i}]=+this.value;save();render()"></div>`}).join('')}<div class="field" style="margin-top:12px"><label>Не нашли нужное?</label><textarea placeholder="Напишите желаемое блюдо"></textarea></div></div>${nav()}`}function rentStep(){return `<div class="panel"><h2>Аренда и доп. услуги</h2><p class="mut">Мебель, посуда и стекло, текстиль, шатры, бар/кофе-станция, оборудование, декор (?), другое.</p>${rent.map((r,i)=>`<div class="dish"><div><b>${r[0]}</b><br><small>${r[1]} · тестовая цена</small></div><input class="qty" type="number" min="0" value="${state.rent[i]||0}" onchange="state.rent[${i}]=+this.value;save();render()"></div>`).join('')}<div class="field" style="margin-top:12px"><label>Не нашли нужное?</label><textarea placeholder="Свободный запрос"></textarea></div></div>${nav()}`}function recommend(p){if(p.kind==='flow')return 0;return Math.max(0,Math.ceil((p.guests||0)/18))}function serviceStep(){return `<div class="panel"><h2>Обслуживание</h2><p class="mut">Рекомендации официантов демонстрационные. Точные нормативы будут утверждены отдельно.</p>${state.program.map((p,i)=>{const key=i;const s=state.service[key]||{};const rec=recommend(p);return `<div class="meal"><b>${p.name||p.format} · ${p.start}${p.end?'–'+p.end:''}</b><div class="grid3" style="margin-top:10px"><div class="field"><label>${p.kind==='flow'?'Сотрудники точки':'Официанты'} ${rec?`· рекомендуем ${rec}`:''}</label><input type="number" value="${s.waiters??rec}" onchange="state.service[${key}]={...(state.service[${key}]||{}),waiters:+this.value};save()"></div><div class="field"><label>Бармены</label><input type="number" value="${s.bar||0}" onchange="state.service[${key}]={...(state.service[${key}]||{}),bar:+this.value};save()"></div><div class="field"><label>Другой персонал</label><input type="number" value="${s.other||0}" onchange="state.service[${key}]={...(state.service[${key}]||{}),other:+this.value};save()"></div></div></div>`}).join('')||'<p class="mut">Нет блоков программы.</p>'}</div>${nav()}`}function venueStep(){return `<div class="panel"><h2>Площадка</h2><div class="field"><label>Название или адрес площадки</label><input value="${state.venue||''}" onchange="state.venue=this.value;save()" placeholder="Можно оставить пустым"></div><p class="mut">Технические вопросы площадки здесь не задаём — менеджер уточнит позже.</p></div>${nav()}`}function wishesStep(){return `<div class="panel"><h2>Пожелания</h2><div class="grid2"><div class="field"><label>Диеты / аллергии</label><input placeholder="Если известны"></div><div class="field"><label>Алкоголь</label><select><option>Не указано</option><option>Нужен</option><option>Не нужен</option><option>Будет свой</option></select></div></div><div class="field" style="margin-top:10px"><label>Комментарий, ТЗ, схема, райдер</label><textarea rows="5" onchange="state.wishes=this.value;save()" placeholder="Опишите важные детали">${state.wishes||''}</textarea></div></div>${nav()}`}function cost(){let t=0;Object.entries(state.menu).forEach(([i,q])=>t+=menu[i][2]*(+q||0));Object.entries(state.rent).forEach(([i,q])=>t+=rent[i][2]*(+q||0));Object.entries(state.service).forEach(([i,s])=>t+=(+s.waiters||0)*4000+(+s.bar||0)*5000+(+s.other||0)*4500);return t}function summaryStep(){return `<div class="panel"><h2>Сводка мероприятия</h2>${sum('Направление',state.direction+' · '+state.type,0)}${sum('Даты',state.dates.join(', ')||'не заполнено — менеджер уточнит',0)}${sum('Программа',state.program.map(p=>`${p.name||p.format} · ${p.start}${p.end?'–'+p.end:''} · ${p.guests} ${p.kind==='flow'?'поток':'чел.'}`).join('<br>')||'не заполнено — менеджер уточнит',1)}${sum('Меню',Object.values(state.menu).some(x=>x>0)?'позиции выбраны':'не заполнено — менеджер уточнит',2)}${sum('Аренда',Object.values(state.rent).some(x=>x>0)?'позиции выбраны':'не заполнено — менеджер уточнит',3)}${sum('Обслуживание','официанты / персонал по блокам',4)}${sum('Площадка',state.venue||'не заполнено — менеджер уточнит',5)}${sum('Пожелания',state.wishes||'не заполнено — менеджер уточнит',6)}<div style="margin-top:18px"><div class="mut">Предварительная стоимость</div><div class="total">${cost().toLocaleString('ru-RU')} ₽</div><div class="mut">Финальную стоимость подтверждает менеджер.</div></div></div><div class="panel"><h2>Контакты</h2><div class="grid2"><div class="field"><label>Имя</label><input onchange="state.contacts.name=this.value;save()"></div><div class="field"><label>Телефон</label><input onchange="state.contacts.phone=this.value;save()"></div><div class="field"><label>Telegram / мессенджер</label><input onchange="state.contacts.messenger=this.value;save()"></div><div class="field"><label>Email</label><input onchange="state.contacts.email=this.value;save()"></div></div><div class="navrow"><button class="btn alt" onclick="prev()">← Назад</button><button class="btn" onclick="submitOrder()">Отправить мероприятие на расчёт</button></div></div>`}function sum(t,c,s){return `<div class="sum"><div class="sumtop"><b>${t}</b>${s!=null?`<button onclick="jump(${s})">Изменить</button>`:''}</div><div class="mut" style="margin-top:6px">${c}</div></div>`}function submitOrder(){state.submitted=true;save();render();scrollTo(0,0)}function success(){return top()+`<main class="wrap success"><div class="pagehead"><h1>Заявка сформирована</h1><p class="mut">В реальном сайте эти данные будут передаваться в Bitrix структурированно.</p></div><div class="panel"><h2>Что получает менеджер</h2><pre>${JSON.stringify({direction:state.direction,event_type:state.type,dates:state.dates,program:state.program,menu:state.menu,rent:state.rent,service:state.service,venue:state.venue,wishes:state.wishes,preliminary_cost:cost(),contacts:state.contacts},null,2)}</pre></div><button class="btn" onclick="state.submitted=false;state.page='config';state.step=7;save();render()">Вернуться к сводке</button> <button class="btn alt" onclick="reset()">Новый проект</button></main>`+foot()}function placeholder(){return `<main class="wrap"><button class="back" onclick="go('home')">← Назад</button><div class="pagehead"><h1>${state.direction}</h1><p class="mut">Следующий этап проектирования. Мы специально не придумываем механику раньше согласования.</p></div><button class="btn alt" onclick="manager()">Связаться с менеджером</button></main>`}function questions(){const q=['Нужны ли короткие поясняющие подписи под названиями категорий мероприятий? Пока не используем.','Декор (?) — какой точный перечень услуг и позиций реально доступен.','Нормативы рекомендаций официантов — точные коэффициенты по форматам.','Точный минимальный состав вопросов внутри этапа «Пожелания».','Раздел «Готовые решения» — состав и конкретные шаблоны ещё будут доработаны.'];return `<main class="wrap questions"><button class="back" onclick="go('home')">← На главную</button><div class="pagehead"><h1>Вопросы на финальное согласование</h1></div>${q.map((x,i)=>`<div class="q"><b>${i+1}.</b> ${x}</div>`).join('')}</main>`}function prefill(d,t){state.direction=d;state.type=t;state.dates=['2026-09-12'];state.program=d==='EVENTS'?[{id:1,kind:'group',name:'VIP-зона',format:'Фуршет',start:'18:00',end:'21:00',guests:120},{id:2,kind:'flow',name:'Кофе-станция',format:'Потоковое обслуживание',start:'10:00',end:'20:00',guests:600,pay:'Организатор оплачивает'}]:[{id:1,kind:'group',name:'',format:'Кофе-брейк',start:'10:00',end:'',guests:100},{id:2,kind:'group',name:'',format:'Комплексное питание / обед',start:'13:00',end:'',guests:100}];state.page='config';state.step=0;save();render();scrollTo(0,0)}function manager(){const old=document.querySelector('.modalbg');if(old)old.remove();const m=document.createElement('div');m.className='modalbg';m.innerHTML=`<div class="modal"><h2>Связаться с менеджером</h2><p class="mut">Мы передадим менеджеру всё, что вы уже успели заполнить. Данные не потеряются.</p><div class="grid2"><div class="field"><label>Имя</label><input></div><div class="field"><label>Телефон / мессенджер</label><input></div></div><div class="navrow"><button class="btn alt" onclick="this.closest('.modalbg').remove()">Отмена</button><button class="btn" onclick="alert('Демо: данные сохранены для менеджера');this.closest('.modalbg').remove()">Передать менеджеру</button></div></div>`;document.body.appendChild(m)}render();</script></body></html>
