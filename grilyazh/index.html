<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Грильяж Кейтеринг — прототип</title><style>:root{--bg:#f3eee7;--paper:#fffaf4;--ink:#211d19;--muted:#756d65;--line:#ded3c7;--accent:#9a6a46;--dark:#28231e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.serif,h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:500}.top{position:sticky;top:0;z-index:20;background:rgba(243,238,231,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.topin{max-width:1180px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:18px}.brand{font:700 22px Georgia}.nav{margin-left:auto;display:flex;gap:14px;align-items:center}.nav button{border:0;background:transparent;color:var(--muted)}.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;padding:11px 17px;font-weight:700}.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}.btn.sm{padding:8px 12px;font-size:13px}.container{max-width:1180px;margin:auto;padding:28px 20px 60px}.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:28px;padding:44px 0}.hero h1{font-size:clamp(52px,7vw,92px);line-height:.93;margin:0 0 22px}.hero p{font-size:18px;line-height:1.5;color:var(--muted)}.art{min-height:480px;border-radius:30px;background:linear-gradient(145deg,#d7c6b6,#efe2d3);position:relative;overflow:hidden}.art:before,.art:after{content:"";position:absolute;border-radius:24px;background:#b99472}.art:before{width:55%;height:60%;left:8%;top:12%;transform:rotate(-5deg)}.art:after{width:45%;height:48%;right:7%;bottom:10%;background:#805d43;transform:rotate(5deg)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:62px}.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px}.stats b{font:500 34px Georgia}.stats span{display:block;color:var(--muted);margin-top:5px}.section{margin:58px 0}.section h2{font-size:42px;margin:0 0 18px}.dirs{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.dir{min-height:220px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:22px}.dir h3{font-size:27px;margin:0}.dir p{color:var(--muted)}.feature{background:var(--dark);color:#fff;border-radius:26px;padding:34px}.feature p{color:#d5ccc3}.ready{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.footer{border-top:1px solid var(--line);padding:25px 20px;color:var(--muted);max-width:1180px;margin:auto;display:flex;justify-content:space-between}.footer button{border:0;background:transparent;color:inherit;text-decoration:underline}.pagehead h1{font-size:52px;margin:8px 0}.pagehead p{color:var(--muted)}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:900px}.choice{border:1px solid var(--line);background:var(--paper);border-radius:18px;padding:24px;text-align:left;min-height:115px}.choice b{font:500 25px Georgia}.scenario{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;max-width:950px}.scenario .main{background:var(--dark);color:#fff}.scenario p{color:var(--muted)}.scenario .main p{color:#d8d0c8}.config{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start}.side{position:sticky;top:76px}.step{width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:11px;color:var(--muted)}.step.active{background:#eadfd3;color:var(--ink);font-weight:700}.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.chead h1{font-size:43px;margin:0}.saved{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 10px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;color:var(--muted)}.field input,.field select,.field textarea{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px}.tabs{display:flex;gap:7px;overflow:auto;margin:10px 0}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px}.tab.active{background:var(--ink);color:#fff}.row{border:1px solid var(--line);background:#fff;border-radius:15px;padding:14px;margin:9px 0}.rowtop{display:flex;justify-content:space-between;gap:8px;align-items:center}.remove{border:0;background:#eee5dc;border-radius:9px;padding:6px 9px}.dish{display:grid;grid-template-columns:1fr 85px;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:11px 0}.dish:last-child{border-bottom:0}.muted{color:var(--muted);font-size:14px}.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:14px}.sum{border-bottom:1px solid var(--line);padding:13px 0}.sum:last-child{border-bottom:0}.sumtop{display:flex;justify-content:space-between}.sumtop button{border:0;background:transparent;color:var(--accent)}.total{font:500 42px Georgia}.modalwrap{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50;display:grid;place-items:center;padding:18px}.modal{max-width:620px;width:100%;background:var(--paper);border-radius:24px;padding:24px}.question{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:17px;margin:10px 0}.hidden{display:none!important}@media(max-width:850px){.nav button:not(.btn){display:none}.hero{grid-template-columns:1fr}.art{min-height:330px}.stats{grid-template-columns:1fr}.dirs{grid-template-columns:1fr 1fr}.ready{grid-template-columns:1fr}.config{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:7px}.step{white-space:nowrap}.choices,.scenario,.grid2,.grid3{grid-template-columns:1fr}.chead{display:block}.saved{display:inline-block;margin-top:10px}.dir{min-height:155px}}@media(max-width:520px){.dirs{grid-template-columns:1fr}.hero h1{font-size:50px}.section h2{font-size:36px}.pagehead h1{font-size:42px}.container{padding-left:15px;padding-right:15px}}</style></head><body><div id="app"></div><script>
const steps=['Даты','Программа питания','Меню','Аренда и доп. услуги','Обслуживание','Площадка','Пожелания','Сводка + контакты'];
const bTypes=['Корпоративное мероприятие','Конференция / форум','Клиентское / партнёрское мероприятие','Деловая встреча / приём','Другое'];
const eTypes=['Публичное / городское мероприятие','Культурное / развлекательное событие','Спортивное мероприятие','Официальное / VIP-мероприятие','Другое'];
const dishes=[['Мини-брускетта с ростбифом',420],['Тарталетка с лососем',390],['Салат с печёной свёклой',350],['Курица с овощами',640],['Треска в соусе голландез',720],['Мини-десерт',290]];
const rentItems=[['Стул',450],['Коктейльный стол',1800],['Скатерть',900],['Комплект бокалов',500],['Шатёр',18000],['Кофе-станция',15000],['Барная стойка',12000],['Другое',0]];
let S=JSON.parse(localStorage.getItem('grilyazh-demo')||'null')||fresh();
function fresh(){return{view:'home',direction:'',eventType:'',step:0,dates:[],program:[],menu:{},rent:{},rentState:'empty',service:{},venue:{mode:'',address:'',help:false},wishes:{diet:'',allergy:'',alcohol:'',comment:'',file:''},contacts:{name:'',phone:'',messenger:'',email:'',company:''},submitted:false}}
function save(){localStorage.setItem('grilyazh-demo',JSON.stringify(S))} function esc(x=''){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))} function money(n){return new Intl.NumberFormat('ru-RU').format(n)+' ₽'}
function top(){return `<header class="top"><div class="topin"><div class="brand" onclick="home()">Грильяж</div><nav class="nav"><button onclick="home();setTimeout(()=>document.getElementById('dirs')?.scrollIntoView(),0)">Направления</button><button onclick="home();setTimeout(()=>document.getElementById('ready')?.scrollIntoView(),0)">Готовые решения</button><button class="btn" onclick="home();setTimeout(()=>document.getElementById('dirs')?.scrollIntoView(),0)">Собрать мероприятие</button></nav></div></header>`}
function footer(){return `<footer class="footer"><span>Грильяж Кейтеринг — рабочий прототип</span><button onclick="S.view='questions';save();render()">Для команды: вопросы</button></footer>`}
function home(){S.view='home';S.submitted=false;save();render();scrollTo(0,0)} function chooseDir(d){if(['PRIVATE','BOX','RENT'].includes(d)){S.direction=d;S.view='placeholder';save();render();scrollTo(0,0);return}S.direction=d;S.eventType='';S.view='types';save();render();scrollTo(0,0)}
function renderHome(){return `${top()}<main class="container"><section class="hero"><div><div class="muted">КАЛИНИНГРАД · КЕЙТЕРИНГ</div><h1>КЕЙТЕРИНГ<br>ПОЛНОГО ЦИКЛА</h1><p>Организуем питание, сервис и инфраструктуру мероприятия — от деловой встречи до городского события.</p><p><button class="btn" onclick="document.getElementById('dirs').scrollIntoView()">Собрать мероприятие</button> <button class="btn alt" onclick="manager()">Связаться с менеджером</button></p></div><div class="art"></div></section><div class="stats"><div class="card"><b>25+</b><span>лет опыта</span></div><div class="card"><b>700+</b><span>мероприятий в год</span></div><div class="card"><b>до 1500+</b><span>гостей</span></div></div><section class="section" id="dirs"><h2>Направления</h2><div class="dirs">${[['BUSINESS','Для компаний и деловых мероприятий'],['EVENTS','Для публичных и событийных проектов'],['PRIVATE','Частные мероприятия'],['BOX','Готовые наборы / доставка'],['RENT','Аренда']].map(x=>`<button class="dir" onclick="chooseDir('${x[0]}')"><div><h3>${x[0]}</h3><p>${x[1]}</p></div><b>→</b></button>`).join('')}</div></section><section class="section feature"><h2>Не просто сайт-витрина</h2><p>Клиент собирает мероприятие сам, а менеджер получает уже структурированную заявку: направление, даты, программу, меню, аренду, обслуживание, площадку и пожелания.</p></section><section class="section" id="ready"><h2>Готовые решения</h2><div class="ready">${[['Конференция на 100 гостей','BUSINESS','Конференция / форум'],['Корпоративный фуршет на 80 гостей','BUSINESS','Корпоративное мероприятие'],['Фестиваль с VIP-зоной','EVENTS','Публичное / городское мероприятие']].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="muted">Концепция. Позже состав решений уточним.</p><button class="btn alt sm" onclick="template('${x[1]}','${x[2]}')">Взять за основу</button></div>`).join('')}</div></section></main>${footer()}`}
function renderTypes(){const arr=S.direction==='BUSINESS'?bTypes:eTypes;return `${top()}<main class="container"><button class="btn alt sm" onclick="home()">← Назад</button><div class="pagehead"><div class="muted">${S.direction}</div><h1>Выберите тип мероприятия</h1></div><div class="choices">${arr.map(t=>`<button class="choice" onclick="selectType('${t.replaceAll("'","\\'")}')"><b>${t}</b></button>`).join('')}</div><p style="margin-top:18px"><button class="btn alt" onclick="manager()">Не уверены, что выбрать? Связаться с менеджером</button></p></main>${footer()}`}
function selectType(t){S.eventType=t;S.view='scenario';save();render();scrollTo(0,0)}
function renderScenario(){return `${top()}<main class="container"><button class="btn alt sm" onclick="S.view='types';save();render()">← Назад</button><div class="pagehead"><div class="muted">${S.direction} · ${esc(S.eventType)}</div><h1>Как продолжим?</h1></div><div class="scenario"><div class="card main"><h2>Собрать самостоятельно</h2><p>Пройдите по этапам и передайте менеджеру максимально полную заявку.</p><button class="btn" style="background:#fff;color:#211d19;border-color:#fff" onclick="start()">Начать сборку</button></div><div class="card"><h2>Связаться с менеджером</h2><p>Если не хотите собирать самостоятельно, менеджер продолжит с уже выбранных данных.</p><button class="btn alt" onclick="manager()">Связаться</button></div></div></main>${footer()}`}
function start(){S.view='config';S.step=0;save();render();scrollTo(0,0)} function jump(n){S.step=n;save();render();scrollTo(0,0)} function next(){if(S.step<7)jump(S.step+1)} function prev(){if(S.step>0)jump(S.step-1)}
function side(){return `<aside class="side">${steps.map((x,i)=>`<button class="step ${S.step===i?'active':''}" onclick="jump(${i})">${i+1}. ${x}</button>`).join('')}</aside>`}
function renderConfig(){if(S.submitted)return renderSuccess();return `${top()}<main class="container"><div class="config"><div>${side()}</div><div><div class="chead"><div><div class="muted">${S.direction} · ${esc(S.eventType)}</div><h1>${steps[S.step]}</h1></div><span class="saved">Автосохранение · данные не потеряются</span></div>${stepHtml()}<p><button class="btn alt sm" onclick="manager()">Связаться с менеджером</button></p></div></div></main>${footer()}`}
function nav(skip=''){return `<div class="navrow"><button class="btn alt" onclick="prev()">← Назад</button><div>${skip?`<button class="btn alt" onclick="next()">${skip}</button> `:''}<button class="btn" onclick="next()">Далее →</button></div></div>`}
function stepHtml(){return [datesStep,programStep,menuStep,rentStep,serviceStep,venueStep,wishesStep,summaryStep][S.step]()}
function datesStep(){return `<div class="panel"><h2>Дата мероприятия</h2><div class="field"><label>Выберите дату</label><input type="date" id="dnew"></div><p><button class="btn alt sm" onclick="addDate()">+ Добавить дату</button></p><div>${S.dates.map((d,i)=>`<button class="tab">${d} <span onclick="removeDate(${i});event.stopPropagation()">×</span></button>`).join('')}</div>${S.dates.length>1?`<div class="grid2" style="margin-top:14px"><label class="card"><input type="radio" name="days" checked> Применить один сценарий ко всем дням</label><label class="card"><input type="radio" name="days"> Настроить каждый день отдельно</label></div><p class="muted">Для нескольких дат дальше используются вкладки дней. Один день можно взять за основу другого.</p>`:''}</div>${nav()}`}
function addDate(){let v=document.getElementById('dnew').value;if(v&&!S.dates.includes(v)){S.dates.push(v);save();render()}} function removeDate(i){S.dates.splice(i,1);save();render()}
function programStep(){return `<div class="panel"><h2>Программа питания</h2><p class="muted">${S.direction==='EVENTS'?'Для EVENTS можно добавить конкретную группу/зону или поток посетителей. Несколько блоков могут работать параллельно.':'Формат, время и количество гостей находятся в одной карточке.'}</p>${S.program.map((p,i)=>programRow(p,i)).join('')}<button class="btn alt" onclick="addProgram()">+ Добавить ${S.direction==='EVENTS'?'блок':'приём пищи'}</button></div>${nav()}`}
function programRow(p,i){const event=S.direction==='EVENTS';return `<div class="row"><div class="rowtop"><b>${event?(p.kind==='flow'?'Поток посетителей':'Группа / зона'):'Приём пищи'} ${i+1}</b><button class="remove" onclick="S.program.splice(${i},1);save();render()">Удалить</button></div>${event?`<div class="field"><label>Тип блока</label><select onchange="S.program[${i}].kind=this.value;save();render()"><option value="group" ${p.kind!=='flow'?'selected':''}>Группа / зона</option><option value="flow" ${p.kind==='flow'?'selected':''}>Поток посетителей</option></select></div>`:''}<div class="grid3" style="margin-top:10px"><div class="field"><label>${event?'Название зоны / точки':'Формат питания'}</label><input value="${esc(p.name||'')}" onchange="S.program[${i}].name=this.value;save()" placeholder="${event?'VIP-зона / Кофе-станция':'Фуршет'}"></div><div class="field"><label>${event&&p.kind==='flow'?'Начало работы':'Время начала'}</label><input type="time" value="${p.start||''}" onchange="S.program[${i}].start=this.value;save()"></div><div class="field"><label>${event&&p.kind==='flow'?'Ожидаемый поток':'Количество человек'}</label><input type="number" value="${p.people||''}" onchange="S.program[${i}].people=+this.value;save()"></div></div>${event&&p.kind==='flow'?`<div class="grid2" style="margin-top:10px"><div class="field"><label>Окончание работы</label><input type="time" value="${p.end||''}" onchange="S.program[${i}].end=this.value;save()"></div><div class="field"><label>Формат работы точки</label><select onchange="S.program[${i}].pay=this.value;save()"><option>Организатор оплачивает</option><option>Продажа посетителям</option><option>Смешанный формат</option></select></div></div>`:event?`<div class="grid2" style="margin-top:10px"><div class="field"><label>Формат питания</label><select onchange="S.program[${i}].format=this.value;save()">${['Кофе-брейк','Фуршет','Банкет','Комплексное питание / обед','Другое'].map(x=>`<option ${p.format===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Время окончания — необязательно</label><input type="time" value="${p.end||''}" onchange="S.program[${i}].end=this.value;save()"></div></div>`:`<div class="field" style="margin-top:10px"><label>Формат питания</label><select onchange="S.program[${i}].format=this.value;save()">${['Кофе-брейк','Фуршет','Банкет','Комплексное питание / обед','Другое'].map(x=>`<option ${p.format===x?'selected':''}>${x}</option>`).join('')}</select></div>`}</div>`}
function addProgram(){S.program.push({id:Date.now(),kind:'group',name:'',format:'Фуршет',start:'',end:'',people:0,pay:'Организатор оплачивает'});save();render()}
function menuStep(){if(!S.program.length)return `<div class="panel"><h2>Меню</h2><p class="muted">Сначала добавьте хотя бы один блок в «Программе питания», либо пропустите меню.</p></div>${nav('Пропустить меню')}`;let p=S.program[0];return `<div class="panel"><h2>Меню</h2><p class="muted">Меню привязано к конкретному приёму пищи / зоне / точке. Формат — рекомендация, а не ограничение.</p><div class="tabs">${S.program.map((x,i)=>`<button class="tab ${i===0?'active':''}">${esc(x.name||x.format||'Блок '+(i+1))}</button>`).join('')}</div>${dishes.map((d,i)=>`<div class="dish"><div><b>${d[0]}</b><div class="muted">Демонстрационная позиция · ${money(d[1])}</div></div><input type="number" min="0" value="${S.menu[p.id]?.[i]||0}" onchange="S.menu[p.id]=S.menu[p.id]||{};S.menu[p.id][${i}]=+this.value;save()"></div>`).join('')}<div class="field" style="margin-top:12px"><label>Не нашли нужное?</label><textarea rows="3" placeholder="Напишите, что требуется"></textarea></div></div>${nav('Пропустить меню')}`}
function rentStep(){return `<div class="panel"><h2>Аренда и доп. услуги</h2><p class="muted">Мебель · Посуда и стекло · Текстиль · Шатры · Бар / кофе-станция · Оборудование · Декор (?) · Другое</p><div class="grid2">${rentItems.map((r,i)=>`<div class="row"><b>${r[0]}</b><div class="muted">${r[1]?money(r[1]):'по запросу'}</div><div class="field" style="margin-top:8px"><label>Количество</label><input type="number" min="0" value="${S.rent[i]||0}" onchange="S.rent[${i}]=+this.value;S.rentState='filled';save()"></div></div>`).join('')}</div><div class="grid2" style="margin-top:12px"><button class="btn alt" onclick="S.rentState='none';S.rent={};save();render()">Аренда не нужна</button><button class="btn alt" onclick="S.rentState='empty';S.rent={};save();render()">Оставить не заполнено</button></div></div>${nav('Пропустить этап')}`}
function recommend(p){return Math.max(0,Math.ceil((p.people||0)/18))} function serviceStep(){return `<div class="panel"><h2>Обслуживание</h2><p class="muted">Для каждого созданного блока сайт предлагает число официантов. Это рекомендация, клиент может изменить её или поставить 0. Коэффициенты пока демонстрационные.</p>${S.program.map((p,i)=>{let sv=S.service[p.id]||{};let rec=recommend(p);return `<div class="row"><b>${esc(p.name||p.format||'Блок '+(i+1))}</b><div class="muted">${p.people||0} человек · Рекомендуем: ${rec} официантов</div><div class="grid3" style="margin-top:10px"><div class="field"><label>Официанты</label><input type="number" value="${sv.waiters??rec}" onchange="S.service[${p.id}]=S.service[${p.id}]||{};S.service[${p.id}].waiters=+this.value;save()"></div><div class="field"><label>Бармены / кофе-станция</label><input type="number" value="${sv.bar||0}" onchange="S.service[${p.id}]=S.service[${p.id}]||{};S.service[${p.id}].bar=+this.value;save()"></div><div class="field"><label>Другой персонал</label><input type="number" value="${sv.other||0}" onchange="S.service[${p.id}]=S.service[${p.id}]||{};S.service[${p.id}].other=+this.value;save()"></div></div></div>`}).join('')||'<p class="muted">Нет блоков программы — можно пропустить этап.</p>'}</div>${nav('Пропустить этап')}`}
function venueStep(){return `<div class="panel"><h2>Площадка</h2><div class="grid2"><button class="choice" onclick="S.venue.mode='yes';save();render()"><b>Площадка выбрана</b></button><button class="choice" onclick="S.venue.mode='no';save();render()"><b>Пока не выбрана</b></button></div>${S.venue.mode==='yes'?`<div class="field" style="margin-top:12px"><label>Название или адрес площадки</label><input value="${esc(S.venue.address)}" onchange="S.venue.address=this.value;save()"></div>`:''}${S.venue.mode==='no'?`<label class="card" style="display:block;margin-top:12px"><input type="checkbox" ${S.venue.help?'checked':''} onchange="S.venue.help=this.checked;save()"> Нужна помощь с подбором площадки</label>`:''}<p class="muted">Технические вопросы площадки здесь не задаём — менеджер уточнит их позже.</p></div>${nav('Пропустить этап')}`}
function wishesStep(){return `<div class="panel"><h2>Пожелания</h2><div class="grid2"><div class="field"><label>Диеты / особенности питания</label><input value="${esc(S.wishes.diet)}" onchange="S.wishes.diet=this.value;save()"></div><div class="field"><label>Аллергии / непереносимости</label><input value="${esc(S.wishes.allergy)}" onchange="S.wishes.allergy=this.value;save()"></div><div class="field"><label>Алкоголь</label><select onchange="S.wishes.alcohol=this.value;save()"><option></option><option>Нужен</option><option>Не нужен</option><option>Будет свой</option><option>Нужна консультация</option></select></div><div class="field"><label>Фото / файл / ТЗ</label><input value="${esc(S.wishes.file)}" onchange="S.wishes.file=this.value;save()" placeholder="Название файла — демо"></div></div><div class="field" style="margin-top:10px"><label>Комментарий</label><textarea rows="5" onchange="S.wishes.comment=this.value;save()">${esc(S.wishes.comment)}</textarea></div></div>${nav('Пропустить этап')}`}
function calc(){let m=0;for(const [pid,o] of Object.entries(S.menu))for(const [i,q] of Object.entries(o))m+=(dishes[i]?.[1]||0)*(q||0);let r=S.rentState==='none'?0:Object.entries(S.rent).reduce((a,[i,q])=>a+(rentItems[i]?.[1]||0)*(q||0),0);let serv=0;for(const p of S.program){let sv=S.service[p.id]||{};serv+=(sv.waiters??recommend(p))*4000+(sv.bar||0)*5000+(sv.other||0)*4500}return{m,r,serv,total:m+r+serv}}
function summaryStep(){let c=calc();return `<div class="panel"><h2>Сводка мероприятия</h2>${sum('Направление и тип',S.direction+' · '+esc(S.eventType),null)}${sum('Даты',S.dates.length?S.dates.join(', '):'не заполнено — менеджер уточнит',0)}${sum('Программа',S.program.length?S.program.map(x=>esc((x.name||x.format||'Блок')+' · '+(x.start||'время не указано')+' · '+(x.people||0)+' чел.')).join('<br>'):'не заполнено — менеджер уточнит',1)}${sum('Меню',c.m?money(c.m):'не заполнено — менеджер уточнит',2)}${sum('Аренда',S.rentState==='none'?'Аренда не нужна':c.r?money(c.r):'не заполнено — менеджер уточнит',3)}${sum('Обслуживание',c.serv?money(c.serv):'не заполнено — менеджер уточнит',4)}${sum('Площадка',S.venue.mode==='yes'?(esc(S.venue.address)||'выбрана, адрес не указан'):S.venue.help?'Нужна помощь с подбором':'не заполнено — менеджер уточнит',5)}${sum('Пожелания',S.wishes.comment||S.wishes.diet||S.wishes.allergy?'заполнено':'не заполнено — менеджер уточнит',6)}<div style="margin-top:20px"><div class="muted">Предварительная стоимость</div><div class="total">${money(c.total)}</div><div class="muted">Финальную стоимость подтверждает менеджер.</div></div></div><div class="panel"><h2>Контакты</h2><div class="grid2"><div class="field"><label>Имя</label><input value="${esc(S.contacts.name)}" onchange="S.contacts.name=this.value;save()"></div><div class="field"><label>Телефон</label><input value="${esc(S.contacts.phone)}" onchange="S.contacts.phone=this.value;save()"></div><div class="field"><label>Telegram / мессенджер</label><input value="${esc(S.contacts.messenger)}" onchange="S.contacts.messenger=this.value;save()"></div><div class="field"><label>Email</label><input value="${esc(S.contacts.email)}" onchange="S.contacts.email=this.value;save()"></div>${S.direction==='BUSINESS'?`<div class="field"><label>Компания</label><input value="${esc(S.contacts.company)}" onchange="S.contacts.company=this.value;save()"></div>`:''}</div><div class="navrow"><button class="btn alt" onclick="prev()">← Назад</button><button class="btn" onclick="submitOrder()">Отправить мероприятие на расчёт</button></div></div>`}
function sum(t,v,s){return `<div class="sum"><div class="sumtop"><b>${t}</b>${s!==null?`<button onclick="jump(${s})">Изменить</button>`:''}</div><div class="muted">${v}</div></div>`} function submitOrder(){if(!S.contacts.phone&&!S.contacts.messenger&&!S.contacts.email){alert('Оставьте телефон, мессенджер или email');return}S.submitted=true;save();render();scrollTo(0,0)}
function renderSuccess(){return `${top()}<main class="container"><div class="pagehead"><div class="muted">Заявка сформирована</div><h1>Мероприятие отправлено на расчёт</h1><p>В реальном сайте эти данные уйдут в Bitrix структурированными полями.</p></div><div class="panel"><h2>Что получает менеджер</h2><div class="sum"><b>Источник</b><div class="muted">Сайт — конфигуратор</div></div><div class="sum"><b>Направление</b><div class="muted">${S.direction}</div></div><div class="sum"><b>Тип события</b><div class="muted">${esc(S.eventType)}</div></div><div class="sum"><b>Даты</b><div class="muted">${S.dates.join(', ')||'не заполнено'}</div></div><div class="sum"><b>Программа</b><div class="muted">${S.program.length} блоков</div></div><div class="sum"><b>Меню / аренда / обслуживание</b><div class="muted">Передаются отдельно, а не одним комментарием</div></div><div class="sum"><b>Площадка / пожелания / файлы</b><div class="muted">Сохраняются отдельными полями</div></div><div class="sum"><b>Предварительная стоимость</b><div class="muted">${money(calc().total)}</div></div></div><button class="btn" onclick="S.submitted=false;S.step=7;save();render()">Вернуться к сводке</button> <button class="btn alt" onclick="S=fresh();save();home()">Новый проект</button></main>${footer()}`}
function manager(){let old=document.getElementById('modal');if(old)old.remove();let d=document.createElement('div');d.id='modal';d.className='modalwrap';d.innerHTML=`<div class="modal"><h2>Связаться с менеджером</h2><p class="muted">Мы передадим менеджеру всё, что уже заполнено. Выбор не потеряется.</p><div class="field"><label>Имя</label><input id="mn" value="${esc(S.contacts.name)}"></div><div class="field" style="margin-top:10px"><label>Телефон / мессенджер</label><input id="mp" value="${esc(S.contacts.phone||S.contacts.messenger)}"></div><div class="navrow"><button class="btn alt" onclick="document.getElementById('modal').remove()">Закрыть</button><button class="btn" onclick="S.contacts.name=document.getElementById('mn').value;S.contacts.phone=document.getElementById('mp').value;save();alert('Демо: данные и весь прогресс переданы менеджеру');document.getElementById('modal').remove()">Передать менеджеру</button></div></div>`;document.body.appendChild(d)}
function template(dir,type){S=fresh();S.direction=dir;S.eventType=type;S.view='config';S.dates=['2026-09-20'];if(dir==='BUSINESS')S.program=[{id:1,name:'',format:'Кофе-брейк',start:'10:00',people:100},{id:2,name:'',format:'Фуршет',start:'17:00',people:100}];else S.program=[{id:1,kind:'group',name:'VIP-зона',format:'Фуршет',start:'18:00',people:120},{id:2,kind:'flow',name:'Кофе-станция',start:'10:00',end:'20:00',people:600,pay:'Организатор оплачивает'}];save();render();scrollTo(0,0)}
function placeholder(){return `${top()}<main class="container"><button class="btn alt sm" onclick="home()">← К направлениям</button><div class="pagehead"><div class="muted">${S.direction}</div><h1>Следующий этап проектирования</h1><p>Для этого направления мы пока не придумываем механику заранее. Сначала отдельно согласуем путь клиента.</p></div><button class="btn alt" onclick="manager()">Связаться с менеджером</button></main>${footer()}`}
function questions(){let q=['Нужны ли короткие подписи-пояснения под категориями мероприятий? Пока не используем.','Декор (?) — какой точный перечень услуг/позиций реально доступен.','Нормативы официантов — точные коэффициенты по форматам.','Точный минимальный состав вопросов этапа «Пожелания».','Готовые решения — состав и конкретные шаблоны ещё будут доработаны.'];return `${top()}<main class="container"><button class="btn alt sm" onclick="home()">← На главную</button><div class="pagehead"><div class="muted">Для команды</div><h1>Вопросы на финальное согласование</h1></div>${q.map((x,i)=>`<div class="question"><b>${i+1}.</b> ${x}</div>`).join('')}</main>${footer()}`}
function render(){let h=S.view==='home'?renderHome():S.view==='types'?renderTypes():S.view==='scenario'?renderScenario():S.view==='config'?renderConfig():S.view==='placeholder'?placeholder():questions();document.getElementById('app').innerHTML=h}
render();
</script></body></html>
